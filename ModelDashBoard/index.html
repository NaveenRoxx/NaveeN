<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Model Upload Dashboard</title>
    <style>
        body {
            font-family: system-ui;
            background: #f7f9fc;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: auto;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

            button:hover {
                opacity: 0.9;
            }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📦 Model Upload Dashboard</h2>
        <input type="file" id="fileInput" accept=".glb,.gltf" />
        <button id="uploadBtn">Upload</button>
        <p id="status"></p>
        <table>
            <thead><tr><th>Name</th><th>URL</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const USERNAME = "NaveenRoxx";
        const REPO = "NaveeN";
        const FOLDER = "ModelDashBoard/Models";

        document.getElementById("uploadBtn").addEventListener("click", async () => {
            const file = document.getElementById("fileInput").files[0];
            if (!file) return alert("Select a model to upload");

            document.getElementById("status").textContent = "Uploading...";

            const formData = new FormData();
            formData.append("file", file);

            const res = await fetch("/.netlify/functions/upload", {
                method: "POST",
                body: formData
            });

            if (res.ok) {
                document.getElementById("status").textContent = "✅ Upload successful!";
                loadFiles();
            } else {
                const err = await res.text();
                document.getElementById("status").textContent = "❌ Error: " + err;
            }
        });

        async function loadFiles() {
            const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER}`);
            const files = await res.json();
            const table = document.getElementById("tableBody");
            table.innerHTML = "";
            files.filter(f => f.name.endsWith(".glb") || f.name.endsWith(".gltf")).forEach(f => {
                const url = `https://${USERNAME}.github.io/${REPO}/${FOLDER}/${f.name}`;
                table.innerHTML += `<tr><td>${f.name}</td><td><a href="${url}" target="_blank">${url}</a></td></tr>`;
            });
        }
        loadFiles();
    </script>
</body>
</html>
