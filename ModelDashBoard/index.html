<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Upload Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }

        .config-section {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

            .config-section label {
                display: block;
                color: #4a5568;
                font-weight: 600;
                margin-bottom: 8px;
                font-size: 14px;
            }

            .config-section input {
                width: 100%;
                padding: 10px;
                border: 2px solid #cbd5e0;
                border-radius: 6px;
                font-size: 14px;
                font-family: 'Courier New', monospace;
            }

                .config-section input:focus {
                    outline: none;
                    border-color: #667eea;
                }

        .server-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            font-size: 13px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e0;
        }

            .status-indicator.connected {
                background: #48bb78;
                box-shadow: 0 0 10px rgba(72, 187, 120, 0.5);
            }

            .status-indicator.disconnected {
                background: #f56565;
            }

        .upload-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .upload-area {
            flex: 1;
            min-width: 200px;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f7fafc;
        }

            .upload-area:hover {
                border-color: #667eea;
                background: #edf2f7;
            }

            .upload-area.dragover {
                border-color: #667eea;
                background: #ebf4ff;
            }

            .upload-area.disabled {
                opacity: 0.6;
                cursor: not-allowed;
                background: #e2e8f0;
                border-color: #cbd5e0;
                pointer-events: none;
            }

                .upload-area.disabled:hover {
                    border-color: #cbd5e0;
                    background: #e2e8f0;
                }

        input[type="file"] {
            display: none;
        }

        .upload-label {
            font-size: 14px;
            color: #718096;
        }

            .upload-label strong {
                color: #667eea;
                display: block;
                margin-bottom: 5px;
            }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            button.secondary {
                background: #48bb78;
            }

            button.danger {
                background: #f56565;
                padding: 8px 16px;
                font-size: 12px;
            }

        .progress-container {
            margin-top: 15px;
            display: none;
        }

            .progress-container.show {
                display: block;
            }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease-out;
            border-radius: 4px;
        }

        .progress-text {
            font-size: 12px;
            color: #718096;
            margin-top: 8px;
            text-align: center;
            font-weight: 500;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
            display: none;
        }

            .status.show {
                display: block;
            }

            .status.loading {
                background: #bee3f8;
                color: #2c5282;
            }

            .status.success {
                background: #c6f6d5;
                color: #22543d;
            }

            .status.error {
                background: #fed7d7;
                color: #742a2a;
            }

        .models-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .model-count {
            color: #718096;
            font-size: 14px;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .model-card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

            .model-card:hover {
                border-color: #667eea;
                transform: translateY(-4px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            }

        .model-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .model-info {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
        }

        .model-url {
            font-size: 11px;
            color: #4a5568;
            background: white;
            padding: 8px;
            border-radius: 6px;
            word-break: break-all;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }

        .model-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

            .model-actions button {
                flex: 1;
                font-size: 12px;
                padding: 8px 12px;
            }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

            .empty-state svg {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
                opacity: 0.5;
            }

        .info-badge {
            display: inline-block;
            background: #ebf4ff;
            color: #2c5282;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .models-grid {
                grid-template-columns: 1fr;
            }

            .upload-section {
                flex-direction: column;
            }

            .upload-area {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Model Upload Dashboard <span class="info-badge" id="networkInfo">Network Mode</span></h1>
            <p class="subtitle">Upload and manage your 3D models for AR visualization</p>

            <!-- Server Configuration -->
            <div class="config-section">
                <label for="serverIP">Server IP Address:</label>
                <input type="text" id="serverIP" placeholder="e.g., 192.168.1.9 or localhost" value="localhost">
                <div class="server-status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="connectionStatus">Not connected</span>
                </div>
            </div>

            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".glb,.gltf" />
                    <label class="upload-label" for="fileInput">
                        <strong>Click or drag GLB/GLTF file</strong>
                        Max size: 100MB
                    </label>
                </div>
                <button class="secondary" id="refreshBtn">Refresh List</button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <div id="status" class="status"></div>
        </div>

        <div class="card">
            <div class="models-header">
                <h2>Your Models</h2>
                <span class="model-count" id="modelCount">0 models</span>
            </div>

            <div id="modelsContainer" class="models-grid"></div>
        </div>
    </div>

    <script>
        let API_URL = "http://localhost:3000";
        let isUploading = false;

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadServerConfig();
            checkServerConnection();
            loadModels();
        });

        // Server IP input handler
        const serverIPInput = document.getElementById("serverIP");
        serverIPInput.addEventListener('change', () => {
            saveServerConfig();
            checkServerConnection();
        });

        serverIPInput.addEventListener('blur', () => {
            saveServerConfig();
            checkServerConnection();
        });

        function saveServerConfig() {
            const ip = serverIPInput.value.trim();
            const serverConfig = { serverIP: ip };
            console.log('Server config saved:', serverConfig);
            API_URL = `http://${ip}:3000`;
            console.log(`Server URL updated to: ${API_URL}`);
            updateNetworkInfo(ip);
        }

        function loadServerConfig() {
            const savedIP = "localhost";
            if (savedIP) {
                serverIPInput.value = savedIP;
                API_URL = `http://${savedIP}:3000`;
                updateNetworkInfo(savedIP);
            }
        }

        function updateNetworkInfo(ip) {
            const badge = document.getElementById('networkInfo');
            if (ip === 'localhost' || ip === '127.0.0.1') {
                badge.textContent = 'Local Mode';
            } else {
                badge.textContent = 'Network Mode';
            }
        }

        async function checkServerConnection() {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('connectionStatus');

            try {
                const res = await fetch(`${API_URL}/health`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(3000)
                });

                if (res.ok) {
                    const data = await res.json();
                    indicator.classList.add('connected');
                    indicator.classList.remove('disconnected');
                    statusText.textContent = `Connected to ${API_URL} (${data.modelsCount} models)`;
                    statusText.style.color = '#22543d';
                    return true;
                }
            } catch (err) {
                indicator.classList.add('disconnected');
                indicator.classList.remove('connected');
                statusText.textContent = `Cannot connect to ${API_URL}`;
                statusText.style.color = '#742a2a';
                return false;
            }
        }

        // Upload area handlers
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");

        uploadArea.addEventListener("click", () => fileInput.click());

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (!isUploading) {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0]);
                }
            }
        });

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length > 0) {
                handleFileSelect(fileInput.files[0]);
            }
        });

        // Reset file input after upload completes
        function resetFileInput() {
            uploadArea.classList.remove("disabled");
        }

        // Refresh button handler
        document.getElementById("refreshBtn").addEventListener("click", () => {
            checkServerConnection();
            loadModels(true);
        });

        function handleFileSelect(file) {
            if (!file.name.endsWith('.glb') && !file.name.endsWith('.gltf')) {
                showStatus("Please select a valid GLB or GLTF file", "error");
                fileInput.value = "";
                return;
            }

            if (file.size > 100 * 1024 * 1024) {
                showStatus("File size exceeds 100MB limit", "error");
                fileInput.value = "";
                return;
            }

            uploadModel(file);
            fileInput.value = "";
        }

        async function uploadModel(file) {
            if (isUploading) {
                showStatus("Upload already in progress", "error");
                return;
            }

            if (!file) {
                return;
            }

            // Check connection before uploading
            const isConnected = await checkServerConnection();
            if (!isConnected) {
                showStatus("Cannot connect to server. Check IP address and ensure server is running.", "error");
                return;
            }

            isUploading = true;
            showProgress(true);
            showStatus(`Uploading ${file.name}...`, "loading");
            uploadArea.classList.add("disabled");

            const formData = new FormData();
            formData.append("file", file);

            try {
                const xhr = new XMLHttpRequest();

                // Track upload progress with accurate calculation
                xhr.upload.addEventListener("progress", (e) => {
                    if (e.lengthComputable) {
                        // Calculate percentage based on actual bytes uploaded vs total
                        const percentComplete = (e.loaded / e.total) * 100;
                        const remainingBytes = e.total - e.loaded;
                        updateProgress(percentComplete, `${formatBytes(e.loaded)} / ${formatBytes(e.total)}`);
                    }
                });

                // Upload finished, now processing on server
                xhr.upload.addEventListener("load", () => {
                    updateProgress(100, "Upload complete, processing...");
                    showStatus(`Processing ${file.name}...`, "loading");
                });

                // Server response received
                xhr.addEventListener("load", () => {
                    setTimeout(() => {
                        if (xhr.status === 200) {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                if (data.success) {
                                    updateProgress(100, "Complete!");
                                    showStatus(`Successfully uploaded ${file.name}!`, "success");
                                    resetFileInput();
                                    loadModels();
                                } else {
                                    showStatus(`Upload failed: ${data.error || "unknown error"}`, "error");
                                }
                            } catch (e) {
                                showStatus("Failed to parse server response", "error");
                            }
                        } else {
                            showStatus(`Upload failed with status ${xhr.status}`, "error");
                        }
                        isUploading = false;
                        setTimeout(() => showProgress(false), 1500);
                    }, 300);
                });

                xhr.addEventListener("error", () => {
                    showStatus("Network error. Make sure the server is running and accessible.", "error");
                    isUploading = false;
                    resetFileInput();
                    showProgress(false);
                });

                xhr.addEventListener("abort", () => {
                    showStatus("Upload cancelled", "error");
                    isUploading = false;
                    resetFileInput();
                    showProgress(false);
                });

                xhr.addEventListener("timeout", () => {
                    showStatus("Upload timeout. File may be too large or connection is slow.", "error");
                    isUploading = false;
                    resetFileInput();
                    showProgress(false);
                });

                xhr.open("POST", `${API_URL}/upload`);
                xhr.timeout = 120000; // 2 minutes timeout
                xhr.send(formData);

            } catch (err) {
                console.error(err);
                showStatus("Network error", "error");
                isUploading = false;
                showProgress(false);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateProgress(percent, message = null) {
            const fill = document.getElementById("progressFill");
            const text = document.getElementById("progressText");
            const clampedPercent = Math.min(100, Math.max(0, percent));

            fill.style.width = clampedPercent + "%";

            if (message) {
                text.textContent = `${Math.round(clampedPercent)}% - ${message}`;
            } else {
                text.textContent = Math.round(clampedPercent) + "%";
            }
        }

        function showProgress(show) {
            const container = document.getElementById("progressContainer");
            if (show) {
                container.classList.add("show");
                updateProgress(0, "Starting upload...");
            } else {
                setTimeout(() => {
                    container.classList.remove("show");
                }, 300);
            }
        }

        async function loadModels(showRefreshStatus = false) {
            if (showRefreshStatus) {
                showStatus("Refreshing models...", "loading");
            }

            try {
                const res = await fetch(`${API_URL}/models`);
                const data = await res.json();

                if (data.success) {
                    displayModels(data.models);
                    document.getElementById("modelCount").textContent =
                        `${data.count} model${data.count !== 1 ? 's' : ''}`;

                    if (showRefreshStatus) {
                        showStatus(`Loaded ${data.count} models`, "success");
                    }
                } else {
                    showStatus("Failed to load models", "error");
                }
            } catch (err) {
                console.error(err);
                if (!showRefreshStatus) {
                    return;
                }
                showStatus("Cannot connect to server. Check the server IP address.", "error");
            }
        }

        function displayModels(models) {
            const container = document.getElementById("modelsContainer");

            if (models.length === 0) {
                container.innerHTML = `
                            <div class="empty-state" style="grid-column: 1/-1;">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                                </svg>
                                <h3>No models yet</h3>
                                <p>Upload your first 3D model to get started</p>
                            </div>
                        `;
                return;
            }

            container.innerHTML = models.map(model => `
                        <div class="model-card">
                            <div class="model-name">${model.name}</div>
                            <div class="model-info">Size: ${formatSize(model.size)}</div>
                            <div class="model-info">Uploaded: ${formatDate(model.uploadDate)}</div>
                            <div class="model-url">${model.url}</div>
                            <div class="model-actions">
                                <button onclick="copyUrl('${model.url}')">Copy URL</button>
                                <button class="danger" onclick="deleteModel('${model.id}', '${model.name}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
        }

        function formatSize(bytes) {
            if (!bytes) return "Unknown";
            const mb = bytes / (1024 * 1024);
            return mb > 1 ? `${mb.toFixed(2)} MB` : `${(bytes / 1024).toFixed(2)} KB`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                showStatus("URL copied to clipboard!", "success");
            }).catch(() => {
                showStatus("Failed to copy URL", "error");
            });
        }

        async function deleteModel(id, name) {
            if (!confirm(`Delete "${name}"?`)) {
                return;
            }

            showStatus(`Deleting ${name}...`, "loading");

            try {
                const res = await fetch(`${API_URL}/models/${id}`, {
                    method: "DELETE"
                });

                const data = await res.json();

                if (data.success) {
                    showStatus(`${name} deleted successfully`, "success");
                    loadModels();
                } else {
                    showStatus(`Failed to delete: ${data.error}`, "error");
                }
            } catch (err) {
                console.error(err);
                showStatus("Network error", "error");
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.className = `status ${type} show`;

            if (type === "success" && !message.includes("URL")) {
                setTimeout(() => {
                    status.classList.remove("show");
                }, 4000);
            }
        }
    </script>
</body>
</html>
