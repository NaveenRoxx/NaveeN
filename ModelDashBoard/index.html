<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Upload Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }

        .upload-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .upload-area {
            flex: 1;
            min-width: 200px;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f7fafc;
        }

            .upload-area:hover {
                border-color: #667eea;
                background: #edf2f7;
            }

            .upload-area.dragover {
                border-color: #667eea;
                background: #ebf4ff;
            }

        input[type="file"] {
            display: none;
        }

        .upload-label {
            font-size: 14px;
            color: #718096;
        }

            .upload-label strong {
                color: #667eea;
                display: block;
                margin-bottom: 5px;
            }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            button.secondary {
                background: #48bb78;
            }

            button.danger {
                background: #f56565;
                padding: 8px 16px;
                font-size: 12px;
            }

        .progress-container {
            margin-top: 15px;
            display: none;
        }

            .progress-container.show {
                display: block;
            }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 12px;
            color: #718096;
            margin-top: 8px;
            text-align: center;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
            display: none;
        }

            .status.show {
                display: block;
            }

            .status.loading {
                background: #bee3f8;
                color: #2c5282;
            }

            .status.success {
                background: #c6f6d5;
                color: #22543d;
            }

            .status.error {
                background: #fed7d7;
                color: #742a2a;
            }

        .models-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .model-count {
            color: #718096;
            font-size: 14px;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .model-card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

            .model-card:hover {
                border-color: #667eea;
                transform: translateY(-4px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            }

        .model-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .model-info {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
        }

        .model-url {
            font-size: 11px;
            color: #4a5568;
            background: white;
            padding: 8px;
            border-radius: 6px;
            word-break: break-all;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }

        .model-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

            .model-actions button {
                flex: 1;
                font-size: 12px;
                padding: 8px 12px;
            }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

            .empty-state svg {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
                opacity: 0.5;
            }

        @media (max-width: 768px) {
            .models-grid {
                grid-template-columns: 1fr;
            }

            .upload-section {
                flex-direction: column;
            }

            .upload-area {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Model Upload Dashboard</h1>
            <p class="subtitle">Upload and manage your 3D models for AR visualization</p>

            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".glb,.gltf" />
                    <label class="upload-label" for="fileInput">
                        <strong>Click or drag GLB/GLTF file</strong>
                        Max size: 100MB
                    </label>
                </div>
                <button class="secondary" id="refreshBtn">Refresh List</button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <div id="status" class="status"></div>
        </div>

        <div class="card">
            <div class="models-header">
                <h2>Your Models</h2>
                <span class="model-count" id="modelCount">0 models</span>
            </div>

            <div id="modelsContainer" class="models-grid"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000";
        let isUploading = false;

        // Load models on page load
        window.addEventListener('DOMContentLoaded', loadModels);

        // Upload area handlers
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");

        uploadArea.addEventListener("click", () => fileInput.click());

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                uploadModel();
            }
        });

        fileInput.addEventListener("change", uploadModel);

        // Refresh button handler
        document.getElementById("refreshBtn").addEventListener("click", () => {
            loadModels(true);
        });

        async function uploadModel() {
            if (isUploading) {
                showStatus("Upload already in progress", "error");
                return;
            }

            const file = fileInput.files[0];

            if (!file) {
                return;
            }

            if (!file.name.endsWith('.glb') && !file.name.endsWith('.gltf')) {
                showStatus("Please select a valid GLB or GLTF file", "error");
                fileInput.value = "";
                return;
            }

            if (file.size > 100 * 1024 * 1024) {
                showStatus("File size exceeds 100MB limit", "error");
                fileInput.value = "";
                return;
            }

            isUploading = true;
            showProgress(true);
            showStatus(`Uploading ${file.name}...`, "loading");

            const formData = new FormData();
            formData.append("file", file);

            try {
                const xhr = new XMLHttpRequest();

                // Track upload progress
                xhr.upload.addEventListener("progress", (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        updateProgress(percentComplete);
                    }
                });

                // Handle completion
                xhr.addEventListener("load", () => {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success) {
                            showStatus(`Successfully uploaded ${file.name}!`, "success");
                            fileInput.value = "";
                            loadModels();
                        } else {
                            showStatus(`Upload failed: ${data.error || "unknown error"}`, "error");
                        }
                    } else {
                        showStatus(`Upload failed with status ${xhr.status}`, "error");
                    }
                    isUploading = false;
                    showProgress(false);
                });

                // Handle errors
                xhr.addEventListener("error", () => {
                    showStatus("Network error. Make sure the Node server is running.", "error");
                    isUploading = false;
                    showProgress(false);
                });

                xhr.addEventListener("abort", () => {
                    showStatus("Upload cancelled", "error");
                    isUploading = false;
                    showProgress(false);
                });

                xhr.open("POST", `${API_URL}/upload`);
                xhr.send(formData);

            } catch (err) {
                console.error(err);
                showStatus("Network error", "error");
                isUploading = false;
                showProgress(false);
            }
        }

        function updateProgress(percent) {
            const fill = document.getElementById("progressFill");
            const text = document.getElementById("progressText");
            fill.style.width = percent + "%";
            text.textContent = Math.round(percent) + "%";
        }

        function showProgress(show) {
            const container = document.getElementById("progressContainer");
            if (show) {
                container.classList.add("show");
                updateProgress(0);
            } else {
                container.classList.remove("show");
            }
        }

        async function loadModels(showRefreshStatus = false) {
            if (showRefreshStatus) {
                showStatus("Refreshing models...", "loading");
            }

            try {
                const res = await fetch(`${API_URL}/models`);
                const data = await res.json();

                if (data.success) {
                    displayModels(data.models);
                    document.getElementById("modelCount").textContent =
                        `${data.count} model${data.count !== 1 ? 's' : ''}`;

                    if (showRefreshStatus) {
                        showStatus(`Loaded ${data.count} models`, "success");
                    }
                } else {
                    showStatus("Failed to load models", "error");
                }
            } catch (err) {
                console.error(err);
                showStatus("Cannot connect to server. Is it running on port 3000?", "error");
            }
        }

        function displayModels(models) {
            const container = document.getElementById("modelsContainer");

            if (models.length === 0) {
                container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                            </svg>
                            <h3>No models yet</h3>
                            <p>Upload your first 3D model to get started</p>
                        </div>
                    `;
                return;
            }

            container.innerHTML = models.map(model => `
                    <div class="model-card">
                        <div class="model-name">${model.name}</div>
                        <div class="model-info">Size: ${formatSize(model.size)}</div>
                        <div class="model-info">Uploaded: ${formatDate(model.uploadDate)}</div>
                        <div class="model-url">${model.url}</div>
                        <div class="model-actions">
                            <button onclick="copyUrl('${model.url}')">Copy URL</button>
                            <button class="danger" onclick="deleteModel('${model.id}', '${model.name}')">Delete</button>
                        </div>
                    </div>
                `).join('');
        }

        function formatSize(bytes) {
            if (!bytes) return "Unknown";
            const mb = bytes / (1024 * 1024);
            return mb > 1 ? `${mb.toFixed(2)} MB` : `${(bytes / 1024).toFixed(2)} KB`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                showStatus("URL copied to clipboard!", "success");
            }).catch(() => {
                showStatus("Failed to copy URL", "error");
            });
        }

        async function deleteModel(id, name) {
            if (!confirm(`Delete "${name}"?`)) {
                return;
            }

            showStatus(`Deleting ${name}...`, "loading");

            try {
                const res = await fetch(`${API_URL}/models/${id}`, {
                    method: "DELETE"
                });

                const data = await res.json();

                if (data.success) {
                    showStatus(`${name} deleted successfully`, "success");
                    loadModels();
                } else {
                    showStatus(`Failed to delete: ${data.error}`, "error");
                }
            } catch (err) {
                console.error(err);
                showStatus("Network error", "error");
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.className = `status ${type} show`;

            if (type === "success" && !message.includes("URL")) {
                setTimeout(() => {
                    status.classList.remove("show");
                }, 4000);
            }
        }
    </script>
</body>
</html>
